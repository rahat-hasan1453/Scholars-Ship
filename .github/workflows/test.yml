name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit + API tests (Vitest, all external services mocked)
        run: npm test

  # Browser tests (Playwright). A separate job, so it can be removed on its own if it ever causes trouble.
  # The Postgres service is a fresh, empty throwaway database for every run; tests/e2e/global-setup.ts
  # pushes the schema and fills it (the seed refuses any non-local database). No secrets are needed.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests (Chromium desktop + mobile)
        run: npx playwright test --project=chromium-desktop --project=chromium-mobile
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
